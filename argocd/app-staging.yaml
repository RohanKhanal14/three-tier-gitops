# ─────────────────────────────────────────────────────────────────────────────
# Argo CD Application — Staging Environment
#
# This tells Argo CD to:
#   1. Watch the GitOps repo for changes
#   2. Render the Helm chart with values.yaml + values-staging.yaml
#   3. Deploy to the three-tier-staging namespace in Minikube
#   4. Auto-sync: prune deleted resources, self-heal manual drift
#
# Apply with:
#   kubectl apply -f argocd/app-staging.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier-staging
  namespace: argocd
  labels:
    environment: staging
    app.kubernetes.io/part-of: three-tier-app
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io    # Clean up resources when app is deleted
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_ORG/three-tier-gitops.git
    targetRevision: main
    path: charts/three-tier-app
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: three-tier-staging

  syncPolicy:
    automated:
      prune: true          # Remove resources deleted from Git
      selfHeal: true       # Revert manual kubectl changes to match Git
      allowEmpty: false     # Don't sync if manifests render to nothing
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true       # Prune after all resources are synced
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        maxDuration: 2m
        factor: 2
