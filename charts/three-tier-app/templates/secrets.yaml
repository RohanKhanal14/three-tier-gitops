{{/*
─────────────────────────────────────────────────────────────────────────────
  Kubernetes Secrets
  
  ⚠️  For production: use External Secrets Operator, AWS Secrets Manager,
     or HashiCorp Vault instead of hardcoded values in Helm charts.
  
  This template is acceptable for teaching/Minikube environments.
  
  To create manually instead of via Helm:
    kubectl create secret generic mongo-secret \
      --from-literal=mongo-root-username=root \
      --from-literal=mongo-root-password=rootpassword \
      --from-literal=mongo-uri="mongodb://root:rootpassword@mongodb:27017/crudapp?authSource=admin" \
      -n three-tier-staging
─────────────────────────────────────────────────────────────────────────────
*/}}
{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
    component: database
    environment: {{ .Values.global.environment }}
type: Opaque
stringData:
  mongo-root-username: {{ .Values.mongodb.auth.rootUsername | quote }}
  mongo-root-password: {{ .Values.mongodb.auth.rootPassword | quote }}
  mongo-uri: "mongodb://{{ .Values.mongodb.auth.rootUsername }}:{{ .Values.mongodb.auth.rootPassword }}@mongodb:27017/{{ .Values.mongodb.auth.database }}?authSource=admin"
{{- end }}
